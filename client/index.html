  <script>
    (function loadFontsDeferred() {
      if ("requestIdleCallback" in window) {
        requestIdleCallback(loadGFonts, { timeout: 3000 });
      } else {
        window.addEventListener("load", function () {
          setTimeout(loadGFonts, 200);
        });
      }
      function loadGFonts() {
        var h = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@100..900&display=swap";
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = h;
        link.media = "all";
        document.head.appendChild(link);
      }
    })();
  </script>
